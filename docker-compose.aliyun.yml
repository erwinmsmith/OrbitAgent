name: orbit-agent

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - orbit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./logs:/app/logs
    networks:
      - orbit

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_ORBIT_API_BASE: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3101:80"
    networks:
      - orbit

volumes:
  redis-data:

networks:
  orbit:
