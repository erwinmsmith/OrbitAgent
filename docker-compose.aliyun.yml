name: orbit-agent

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - orbit
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - orbit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: orbit_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./logs:/app/logs
    networks:
      - orbit

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_ORBIT_API_BASE: /api/v1
        NPM_REGISTRY: https://registry.npmmirror.com
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3101:80"
    networks:
      - orbit

volumes:
  mongo-data:
  redis-data:

networks:
  orbit:
