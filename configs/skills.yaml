skills:
  - id: context-enrichment
    name: Context Enrichment
    description: Enriches conversation context with relevant information
    version: "1.0.0"
    enabled: true
    priority: 10
    triggers:
      - type: always

  - id: intent-classification
    name: Intent Classification
    description: Classifies user intent from the message
    version: "1.0.0"
    enabled: true
    priority: 5
    triggers:
      - type: keyword
        pattern: "help"
      - type: keyword
        pattern: "?"
